# SearXNG settings for MeoDeo.
# MeoDeo already searches YouTube, Dailymotion, PeerTube, Odysee, Internet
# Archive, Wikimedia Commons, NASA and Europeana itself, so SearXNG's job is
# to find videos on OTHER websites. Everything not listed keeps SearXNG's
# defaults.
use_default_settings: true

general:
  instance_name: "MeoDeo SearXNG"

search:
  safe_search: 1
  # MeoDeo reads results through the JSON API, which SearXNG turns off by default.
  formats:
    - html
    - json

server:
  # Set through SEARXNG_SECRET (docker-compose.yml, or the Render service).
  # This instance is private to MeoDeo, so don't rate-limit it.
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  # Free servers are slow: give each search engine more time to answer.
  request_timeout: 6.0
  max_request_timeout: 12.0

ui:
  default_theme: simple

engines:
  # Video sources for other websites (off in SearXNG by default).
  - name: rumble
    disabled: false
  - name: bitchute
    disabled: false
  - name: bilibili
    disabled: false
  - name: niconico
    disabled: false
  - name: media.ccc.de
    disabled: false
  - name: ina
    disabled: false
  - name: mediathekviewweb
    disabled: false
  - name: acfun
    disabled: false
  - name: qwant videos
    disabled: false
  - name: fireball videos
    disabled: false
  - name: privacywall videos
    disabled: false
  - name: tusksearch videos
    disabled: false
  - name: vuhuv videos
    disabled: false
  # Sites MeoDeo already searches directly: no need to ask SearXNG.
  - name: youtube
    disabled: true
  - name: dailymotion
    disabled: true
  - name: sepiasearch
    disabled: true
  - name: wikicommons.videos
    disabled: true
